<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: #fff; }
  .row { display: flex; gap: 14px; padding: 22px; }
  .sw { flex: 1; border-radius: 14px; height: 96px; box-shadow: var(--shadow-soft);
        display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; box-sizing: border-box; }
  .name { font-family: var(--font-display); font-size: 22px; line-height: 1; }
  .hex { font-family: var(--font-meta); font-weight: 800; font-size: 12px; letter-spacing: .3px; opacity: .9; }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background:var(--mv-orange);color:#fff"><span class="name">Orange</span><span class="hex">#FB8500</span></div>
  <div class="sw" style="background:var(--mv-navy);color:#fff"><span class="name">Navy</span><span class="hex">#023047</span></div>
  <div class="sw" style="background:var(--mv-blue);color:#fff"><span class="name">Blue</span><span class="hex">#219EBC</span></div>
  <div class="sw" style="background:var(--mv-red);color:#fff"><span class="name">Red</span><span class="hex">#D62828</span></div>
  <div class="sw" style="background:var(--mv-teal);color:#fff"><span class="name">Teal</span><span class="hex">#00A896</span></div>
</div>
</body>
</html>
