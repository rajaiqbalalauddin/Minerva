<!-- @dsCard group="Colors" viewport="700x150" name="Pastel tints" subtitle="Soft washes for chip & badge backgrounds" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: #fff; }
  .row { display: flex; gap: 14px; padding: 22px; }
  .sw { flex: 1; border-radius: 14px; height: 78px; box-shadow: var(--shadow-soft);
        display: flex; align-items: center; justify-content: center; }
  .name { font-family: var(--font-display); font-size: 20px; line-height: 1; }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background:var(--mv-orange-soft);color:var(--mv-orange-deep)"><span class="name">orange-soft</span></div>
  <div class="sw" style="background:var(--mv-blue-soft);color:var(--mv-blue-deep)"><span class="name">blue-soft</span></div>
  <div class="sw" style="background:var(--mv-red-soft);color:var(--mv-red-deep)"><span class="name">red-soft</span></div>
  <div class="sw" style="background:var(--mv-teal-soft);color:var(--mv-teal-deep)"><span class="name">teal-soft</span></div>
</div>
</body>
</html>
