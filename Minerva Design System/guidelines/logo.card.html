<!-- @dsCard group="Brand" viewport="700x200" name="Logo" subtitle="MINERVA runner mark on a white shadowed pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--mv-navy); }
  .wrap { padding: 34px; display:flex; gap:28px; align-items:center; }
  .pill { background:#fff; border-radius: var(--radius-md); box-shadow: var(--shadow-pop);
          padding: 10px 26px; display:flex; align-items:center; }
  .pill img { height: 64px; width:auto; }
  .note { font-family: var(--font-meta); font-weight:800; font-size:13px; color:var(--mv-grey); max-width:280px; line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="pill"><img src="../assets/minerva-logo.png" alt="Minerva" /></div>
  <span class="note">Always on a white pill with a hard drop shadow when placed on the navy sidebar. Keep clear space ≈ half the mark height.</span>
</div>
</body>
</html>
