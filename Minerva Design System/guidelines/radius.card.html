<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: #fff; }
  .row { display:flex; gap:22px; padding: 28px; align-items:center; }
  .box { width:110px; height:90px; background:var(--mv-blue); box-shadow:var(--shadow-soft);
         display:flex; align-items:flex-end; padding:10px; box-sizing:border-box; color:#fff;
         font-family: var(--font-display); font-size:18px; }
</style>
</head>
<body>
<div class="row">
  <div class="box" style="border-radius:var(--radius-sm)">15 · sm</div>
  <div class="box" style="border-radius:var(--radius-md)">30 · md</div>
  <div class="box" style="border-radius:var(--radius-frame)">60 · frame</div>
  <div class="box" style="border-radius:var(--radius-blob);background:var(--mv-teal)">blob</div>
</div>
</body>
</html>
