<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: #fff; color: var(--mv-navy); }
  .wrap { padding: 24px; display:flex; flex-direction:column; gap:10px; }
  .item { display:flex; align-items:center; gap:14px; }
  .bar { height: 18px; background: var(--mv-orange); border-radius: 4px; }
  .k { font-family: var(--font-meta); font-weight:800; font-size:12px; width:120px; color:var(--mv-grey); }
</style>
</head>
<body>
<div class="wrap">
  <div class="item"><span class="k">space-2 · 8</span><span class="bar" style="width:8px"></span></div>
  <div class="item"><span class="k">space-3 · 12</span><span class="bar" style="width:12px"></span></div>
  <div class="item"><span class="k">space-4 · 16</span><span class="bar" style="width:16px"></span></div>
  <div class="item"><span class="k">space-5 · 24</span><span class="bar" style="width:24px"></span></div>
  <div class="item"><span class="k">space-6 · 32</span><span class="bar" style="width:32px"></span></div>
  <div class="item"><span class="k">space-8 · 56</span><span class="bar" style="width:56px"></span></div>
  <div class="item"><span class="k">space-9 · 72</span><span class="bar" style="width:72px"></span></div>
</div>
</body>
</html>
