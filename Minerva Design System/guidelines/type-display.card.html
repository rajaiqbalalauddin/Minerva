<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: #fff; color: var(--mv-navy); }
  .wrap { padding: 24px; display:flex; flex-direction:column; gap:10px; }
  .d { font-family: var(--font-display); line-height: 1; letter-spacing: .5px; }
  .tag { font-family: var(--font-meta); font-weight:800; font-size:11px; color:var(--mv-grey); }
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">DISPLAY 48 · page title</span>
  <span class="d" style="font-size:48px; color:var(--mv-orange)">Dashboard</span>
  <span class="tag">STAT 56 · balance</span>
  <span class="d" style="font-size:56px; color:var(--mv-orange)">RM 6767.67</span>
  <span class="tag">H2 40 · section · H4 32 · button</span>
  <span class="d" style="font-size:40px">Pending task &nbsp; <span style="font-size:32px;color:var(--mv-grey)">Add purchase</span></span>
</div>
</body>
</html>
