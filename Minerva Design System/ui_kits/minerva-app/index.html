<!-- @dsCard group="Minerva App" viewport="1440x900" name="Minerva — productivity app" subtitle="Interactive: Dashboard · Pomodoro · Tasks · Budget · Badges" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minerva</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; height: 100%; background: #d7dde1; font-family: var(--font-body); }
  *, *::before, *::after { box-sizing: border-box; }
  #root { height: 100%; }
  .frame {
    display: flex;
    height: 100vh;
    background: var(--mv-white);
    overflow: hidden;
  }
  .content {
    flex: 1;
    min-width: 0;
    padding: 32px 40px 48px;
    overflow-y: auto;
  }
  /* scrollbar */
  .content::-webkit-scrollbar { width: 10px; }
  .content::-webkit-scrollbar-thumb { background: #cfd6db; border-radius: 999px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<script type="text/babel" src="./DashboardScreen.jsx"></script>
<script type="text/babel" src="./PomodoroScreen.jsx"></script>
<script type="text/babel" src="./TasksScreen.jsx"></script>
<script type="text/babel" src="./BudgetScreen.jsx"></script>
<script type="text/babel" src="./BadgesScreen.jsx"></script>
<script type="text/babel">
  const NS = window.MinervaDesignSystem_5790c8;
  const D = window.MinervaData;
  const { Sidebar } = NS;

  function App() {
    const [page, setPage] = React.useState("Dashboard");
    const go = (p) => { setPage(p); document.querySelector(".content")?.scrollTo(0, 0); };

    const screens = {
      Dashboard: <window.DashboardScreen data={D}
        onStartPomodoro={() => go("Pomodoro")} onAddTask={() => go("Tasks")} onGoBudget={() => go("Budget")} />,
      Pomodoro: <window.PomodoroScreen data={D} />,
      Tasks: <window.TasksScreen data={D} />,
      Budget: <window.BudgetScreen data={D} />,
      Badges: <window.BadgesScreen data={D} />,
    };

    return (
      <div className="frame">
        <Sidebar items={D.nav} active={page} onNavigate={go} logoSrc="../../assets/minerva-logo.png" />
        <main className="content">{screens[page]}</main>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
