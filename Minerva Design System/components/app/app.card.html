<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: #f1f4f6; font-family: var(--font-body); }
  .wrap { padding: 28px; display: flex; flex-direction: column; gap: 24px; }
  .lbl { font-family: var(--font-display); font-size: 20px; color: var(--mv-grey); letter-spacing:.5px; margin-bottom:-8px;}
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .nav { width: 200px; background: var(--mv-navy); border-radius: 18px; padding: 14px; display:flex; flex-direction:column; gap:12px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const NS = window.MinervaDesignSystem_5790c8;
  const { NavItem, PageHeader, Button, Avatar, TaskChip, StatCard, AchievementBadge, PomodoroDial, ProgressBar } = NS;
  function Demo() {
    return (
      <>
        <PageHeader title="Dashboard" date="Tuesday 23 June 2026"
          actions={<><Button icon={<span>+</span>}>Task</Button><Avatar name="Raja Kumar" size={56} /></>} />

        <div className="lbl">Nav items</div>
        <div className="row">
          <div className="nav">
            <NavItem active>Dashboard</NavItem>
            <NavItem>Pomodoro</NavItem>
            <NavItem>Budget</NavItem>
          </div>
          <div style={{display:"flex", gap:16, flexWrap:"wrap", flex:1}}>
            <TaskChip title="Assignment" time="7.00 a.m , Today" tone="red" style={{minWidth:200}} />
            <TaskChip title="Gym" time="12.00 p.m , Tomorrow" tone="orange" style={{minWidth:200}} />
            <TaskChip title="Watch Anime" time="9.00 a.m , 27 June" tone="teal" done style={{minWidth:200}} />
          </div>
        </div>

        <div className="lbl">Stat card · Pomodoro dial</div>
        <div className="row">
          <StatCard caption="Balance :" value="RM 6767.67" align="center" style={{width:240}}
            footer={<Button variant="orange-navy" full>Add purchase</Button>} />
          <PomodoroDial time="17:42" progress={0.3} tone="orange" label="FOCUS" size={240} />
        </div>

        <div className="lbl">Achievement badges</div>
        <div className="row">
          <AchievementBadge label="Focus x10" glyph="🔥" tone="orange" caption="10 sessions" />
          <AchievementBadge label="Big Saver" glyph="💰" tone="teal" caption="Under budget" />
          <AchievementBadge label="Night Owl" tone="blue" unlocked={false} caption="Locked" />
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById("app")).render(<Demo />);
</script>
</body>
</html>
